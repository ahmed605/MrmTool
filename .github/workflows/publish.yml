name: Publish Artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Publish x64
        run: msbuild MrmTool/MrmTool.csproj /restore /p:Configuration=Release /p:Platform=x64 /p:DeployOnBuild=true /t:Publish

      - name: Publish ARM64
        run: msbuild MrmTool/MrmTool.csproj /restore /p:Configuration=Release /p:Platform=ARM64 /p:DeployOnBuild=true /t:Publish

      - name: Create x64 artifact
        run: |
          7z a -t7z -mx=9 win-x64.7z .\MrmTool\bin\Release\*\win-x64\publish\*

      - name: Create ARM64 artifact
        run: |
          7z a -t7z -mx=9 win-arm64.7z .\MrmTool\bin\Release\*\win-arm64\publish\*

      - name: Upload x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: win-x64.7z

      - name: Upload ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: win-arm64
          path: win-arm64.7z
