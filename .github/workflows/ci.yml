name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build app
        run: msbuild MrmTool/MrmTool.csproj /restore /p:Configuration=Release /p:Platform=x64
